[project]
name = "backend"
version = "0.1.0"
description = "SovereignAI - Privacy-First Local AI Engine"
authors = [
    { name = "SovereignAI Team", email = "contact@sovereignai.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate==0.34.1",
    "aiofiles==23.2.1",
    "aiohttp==3.9.1",
    "aiosqlite==0.19.0",
    "cryptography==41.0.7",
    "faiss-cpu>=1.7.4",
    "fastapi==0.109.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.23.0",
    "numpy>=1.24.0,<2.0.0",
    "pillow>=12.1.1",
    "prompt-toolkit==3.0.43",
    "psutil==5.9.7",
    "llmfit>=1.1.6",
    "pyyaml>=6.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "pypdf==3.17.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "python-multipart==0.0.6",
    "rich==13.7.0",
    "safetensors>=0.4.0",
    "sentence-transformers>=2.2.0",
    "tensorflow>=2.18.1",
    "toml>=0.10.2",
    "torch==2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm==4.66.4",
    "transformers==4.45.2",
    "typer==0.9.0",
    "uvicorn[standard]==0.27.0",
    "websockets==12.0",
    "bcrypt==4.2.0",
    "slowapi==0.1.9",
    "gguf>=0.10.0",
    "llama-cpp-python>=0.3.34",
    "ik-llama-cpp-python>=0.1.0",
]

[dependency-groups]
dev = [
    "black>=24.1.1",
    "isort>=5.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sovereign = "app.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
